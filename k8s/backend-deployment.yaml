apiVersion: apps/v1
kind: Deployment
metadata:
  name: minantrack-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minantrack-api
  template:
    metadata:
      labels:
        app: minantrack-api
    spec:
      containers:
        - name: minantrack-api
          image: minantrack-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
---
apiVersion: v1
kind: Service
metadata:
  name: minantrack-api
spec:
  selector:
    app: minantrack-api
  ports:
    - port: 80
      targetPort: 8080
